name: Lint all Python files

on:
  push:
    branches:
      - dev
      - 0.57.x
      - 0.58.x
      - 0.80.x
      - 0.81.x
  pull_request:
    branches:
      - dev
      - 0.57.x
      - 0.58.x
      - 0.80.x
      - 0.81.x

jobs:
  prospector:
    name: Run Prospector on all Python files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
          cache: 'pip'
          cache-dependency-path: |
            **/setup.py
            **/pyproject.toml

      - name: Cache Linters Tool Storage
        uses: actions/cache@v6
        with:
          path: ~/.cache
          key: ${{ runner.os }}-prospector-${{ hashFiles('**/setup.py', '**/pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-prospector-${{ hashFiles('**/setup.py', '**/pyproject.toml') }}-
            ${{ runner.os }}-prospector-

      - name: Install MPF
        run: |
          sudo apt-get install -y libjpeg-dev
          pip install --upgrade pip setuptools wheel build prospector
          pip install -e .

      - name: Run Prospector
        run: prospector
