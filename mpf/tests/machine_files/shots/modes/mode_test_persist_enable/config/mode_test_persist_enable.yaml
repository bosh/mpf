#config_version=6

mode:
  priority: 100

shot_profiles:
  pe_profile:
    advance_on_hit: false
    states:
      - name: pe_state_1
      - name: pe_state_2

shots:
  pe_test_default:
    switch: switch_29
    # persist_enable: default
    profile: pe_profile
    disable_events: pe_test_disable_all_shots
    enable_events: pe_test_enable_all_shots
  pe_test_property_enabled:
    switch: switch_29
    persist_enable: true
    profile: pe_profile
    disable_events: pe_test_disable_all_shots
    enable_events: pe_test_enable_all_shots
  pe_test_property_disabled:
    switch: switch_29
    persist_enable: false
    profile: pe_profile
    disable_events: pe_test_disable_all_shots
    enable_events: pe_test_enable_all_shots
