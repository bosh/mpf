#config_version=6

event_player:
    test_event_player1:
        - test_event_player2
        - test_event_player3
    test_event_player_delayed:
        - test_event_player2|2s
        - test_event_player3:2s
    "{machine.lifetime_earnings >= 500}": never_happens_machine
    "{machine.switches.s_test_1.state == 1}": sometimes_happens_switch

switches:
    s_test_1:
        number:

random_event_player:
    test_random_event_player1:
      events:
        - test_random_event_player2
        - test_random_event_player3
      scope: machine

modes:
  - test_mode
  - game_mode
